[workspace]
resolver = "2"
members = [
    "crates/qsoftphone-core",
    "crates/qsoftphone-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/litchdrom/qsoftphone-rs"

# ---------------------------------------------------------------------------
# Pinned dependency set.
#
# The brief pins the stack: rsipstack for SIP, rtc for the media plane,
# cpal for capture/playback, egui/eframe for the GUI, rusqlite for storage.
# Versions below are the current releases as of 2026-10-26 and are locked
# by the committed Cargo.lock.
#
# Deviations from the brief, and why:
#   * rusqlite "0.41" (brief said "0.3x"). 0.41 is the current release;
#     the "0.3x" note was written against an older line.
#   * rsipstack default features are NOT used. The brief's transport list
#     is udp/tcp/tls only, so the `websocket` feature (tokio-tungstenite)
#     and `srv_lookup` feature (hickory-resolver) are both off. That keeps
#     the tree inside the ~250-crate budget. Re-enable in one place here.
# ---------------------------------------------------------------------------
[workspace.dependencies]
qsoftphone-core = { path = "crates/qsoftphone-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rsipstack = { version = "0.7", default-features = false, features = [
    "platform-tokio",
    "std",
    "rustls",
] }
rtc = { version = "0.21", default-features = false, features = ["crypto-ring"] }
cpal = "0.18"
eframe = "0.37"
egui = "0.37"

[profile.dev]
opt-level = 0
debug = 1
