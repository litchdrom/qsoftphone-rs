[package]
name = "qsoftphone-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "qsoftphone-rs desktop softphone (egui/eframe)."

[[bin]]
name = "qsoftphone"
path = "src/main.rs"

[dependencies]
qsoftphone-core.workspace = true
qsoftphone-sip.workspace = true

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

tokio.workspace = true
eframe.workspace = true
egui.workspace = true

# The media plane, pinned from the start so the dependency budget is
# measured with the whole stack. The app does not touch it until M4 —
# `rtc` drives the RTP/SRTP session and `cpal` the sound card.
rtc.workspace = true
cpal.workspace = true
