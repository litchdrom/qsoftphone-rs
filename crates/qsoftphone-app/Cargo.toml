[package]
name = "qsoftphone-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "qsoftphone-rs desktop softphone (egui/eframe)."

[[bin]]
name = "qsoftphone"
path = "src/main.rs"

[dependencies]
qsoftphone-core.workspace = true
qsoftphone-media.workspace = true
qsoftphone-sip.workspace = true

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

tokio.workspace = true
eframe.workspace = true
egui.workspace = true

# The HTTP client for the per-account status action (M6.13): an account
# can be told to run an HTTP query when its status changes.
#
# `ureq` is small, pure Rust and blocking — and the action runs on a
# thread of its own, because the interface thread never waits for
# anything (§3). It is version 3 and declares the same floor as this
# workspace (1.85). The TLS it brings is `rustls`, which is already in
# the tree for rsipstack.
#
# The dependency budget is in the README.
ureq = "3"

# The media plane, pinned from the start so the dependency budget is
# measured with the whole stack. The app does not touch it until M4 —
# `rtc` drives the RTP/SRTP session and `cpal` the sound card.
rtc.workspace = true
cpal.workspace = true

# The system tray icon — the app lives in the notification area when
# the window is hidden, and a call that comes in brings it back (M6.30).
#
# `tray-icon` is the cross-platform tray: on Windows it is the shell's
# own `Shell_NotifyIcon` and it needs only `windows-sys`, which is
# already in the tree through winit. The menu is `muda`, and it is
# plain Win32 on Windows.
#
# The default features are **off** on purpose. They are the Linux tray
# (`libappindicator`, and with it `gtk`) and `libxdo`, and this build
# does not pull GTK into the tree — the same reason `rfd` uses the
# portal backend below. So the tray is a Windows and macOS feature
# here: on Linux the icon cannot be made, the app says so in the log,
# and the close button ends the app as it always did.
#
# The `common-controls-v6` feature of `muda` is **not** enabled either.
# It swaps the "About" dialog of the menu for a `TaskDialog`, and that
# call lives in the common controls **version 6** — which is loaded
# side by side and needs an application manifest. Without the manifest
# the loader cannot find the entry point and the program does not
# start at all: the app died with `STATUS_ENTRYPOINT_NOT_FOUND` before
# it drew anything.
#
# The version is 0.24 and not 0.25 on purpose. 0.25 (published
# 2026-11-14) declares `rust-version = "1.90"`, which would raise the
# workspace's floor from 1.85 for a tray icon. 0.24.2 declares 1.73 and
# brings the same crates.
#
# The dependency budget is in the README.
tray-icon = { version = "0.24", default-features = false }

# The native file dialog — the operating system's own "pick a file"
# window, which is what the C++ has (Qt's `FileDialog`).
#
# On Windows and macOS it brings **nothing** else with it: the
# Windows backend is the COM `IFileOpenDialog` and the macOS one is
# `NSOpenPanel`, and both need only what is already in the tree
# (`windows-sys`, `raw-window-handle`, `log`). On Linux the default
# features are the portal backend, which is the one that needs no
# system libraries — `gtk3` would need GTK installed.
#
# The version is 0.17 and not 0.18 on purpose. 0.18 (published
# 2026-11-07) declares `rust-version = "1.92"`, which would raise
# the workspace's floor from 1.85 and turn nine clippy findings that
# predate this milestone into build errors in the media and core
# crates. 0.17.2 declares no floor of its own and brings the same
# dependencies.
#
# The dependency budget is in the README.
[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.17", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17" }
